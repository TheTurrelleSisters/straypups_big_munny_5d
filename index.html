<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>StrayPups Big Munny $5 v5.28</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08000f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StrayPups $5">
<link rel="stylesheet" href="css/styles.css?v=5.28">
</head>
<body>
<div id="asset-store">
  <img id="img-scott" src="assets/scott_full.png" alt="" hidden>
  <img id="img-splash" src="assets/splash.jpg" alt="" hidden>
  <img id="img-banner" src="assets/banner.jpg" alt="" hidden>
  <audio id="snd-credits" src="assets/credits_addup.wav"></audio>
  <audio id="snd-redspin" src="assets/red_spin_music.mp3"></audio>
  <audio id="snd-ring" src="assets/ring1.mp3"></audio>
  <audio id="snd-welcome" src="assets/splash_welcome.wav"></audio>
</div><div id="splash">
  <div id="splash-bg"></div>
  <div id="splash-foot">
    <div id="splash-title">STRAYPUPS BIG MUNNY</div>
    <div id="splash-ver">$5 &bull; v5.28</div>
    <div id="splash-bar"><div id="splash-bar-fill"></div></div>
    <div id="splash-tap">TAP TO PLAY</div>
  </div>
</div>

<div id="app">
  <div id="hdr-img"><img id="hdr-img-el" src="" alt="StrayPups Big Munny"></div>

  <!-- BINGO SECTION: pattern name + card + ball strip -->
  <div id="bingo-section">
    <div id="bingo-pattern-name">&nbsp;</div>
    <div id="bingo-card-area">
      <div id="bingo-card-wrap">
        <div id="bingo-col-hdrs">
          <div class="bcol-hdr">B</div><div class="bcol-hdr">I</div>
          <div class="bcol-hdr">N</div><div class="bcol-hdr">G</div><div class="bcol-hdr">O</div>
        </div>
        <div id="bingo-grid"></div>
      </div>
      <!-- Ball strip BELOW card -->
      <div id="ball-strip-area">
        <div id="ball-strip-grid"></div>
      </div>
    </div>
  </div>

  <!-- REEL SECTION â€” bigger -->
  <div id="reel-section">
    <div id="reel-frame">
      <div id="red-ov"></div>
      <div id="payline-mark"></div>
      <div id="pl-left">PAYLINE</div>
      <div id="pl-right">PAYLINE</div>
      <div id="rs-badge">RED SPIN</div>
      <div class="reel" id="r0"><div class="reel-window" id="rw0"><div class="reel-strip" id="rs0"></div></div></div>
      <div class="reel" id="r1"><div class="reel-window" id="rw1"><div class="reel-strip" id="rs1"></div></div></div>
      <div class="reel" id="r2"><div class="reel-window" id="rw2"><div class="reel-strip" id="rs2"></div></div></div>
    </div>
  </div>

  <div id="prog-meter">
    <div id="prog-meter-lbl">&#9733; PROGRESSIVE JACKPOT &#9733;</div>
    <div id="prog-meter-val">$500.00</div>
  </div>
<div id="win-row">
    <div class="wbox"><div class="wlbl">WIN</div><div class="wval" id="wval">$0.00</div></div>
    <div id="bt-box"><div id="bt-lbl">BONUS TOTAL</div><div id="bt-val">$0.00</div></div>
  </div>
  <div id="win-msg"></div>
  <div id="info-bar">
    <div class="iitem"><div class="ilbl">BALANCE</div><div class="ival" id="bval">$100.00</div></div>
    <div class="iitem"><div class="ilbl">BET</div><div class="ival" id="betval">$1.00</div></div>
    <div class="iitem"><div class="ilbl">DENOM</div><div class="ival">$5</div></div>
  </div>
  <div id="controls">
    <div id="ctrl-top">
      <button class="cbtn" id="cred-btn">CREDITS: <span id="cdisp">1</span></button>
      <button class="cbtn" id="spin-btn">SPIN</button>
      <button class="cbtn" id="max-btn">BET MAX<br><span style="font-size:10px">3 CREDITS</span></button>
    </div>
    <div id="ctrl-btm">
      <button class="abtn aco" id="co-btn">$$ CASH OUT</button>
      <button class="abtn" id="help-btn" style="background:linear-gradient(135deg,#0d001a,#1a0035);border:1.5px solid var(--gold-dk);color:var(--gold-lt)">PAYS</button>
      <button class="abtn aic" id="ic-btn">+ INSERT CASH</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="jp-ov">
  <div id="jp-burst"></div><div id="jp-big">JACKPOT!</div>
  <div id="jp-sub">CONGRATULATIONS!</div><div id="jp-amt"></div>
  <div id="jp-hint">TAP TO CONTINUE</div>
</div>
<div id="ic-ov">
  <div class="ic-ttl">INSERT CASH</div>
  <div class="ic-pre-row">
    <button class="icpre" data-a="100">$100</button><button class="icpre" data-a="500">$500</button>
    <button class="icpre" data-a="1000">$1,000</button><button class="icpre" data-a="5000">$5,000</button>
  </div>
  <div class="ic-row">
    <span style="color:var(--gold);font-size:19px">$</span>
    <input class="ic-inp" type="number" id="ic-inp" value="100" min="1" max="9999">
    <button class="icbtn ok" id="ic-ok">ADD</button>
    <button class="icbtn" id="ic-no">CANCEL</button>
  </div>
</div>
<div id="help">
  <div id="help-hdr"><div id="help-ttl">PAY TABLE</div><button id="help-close">CLOSE</button></div>
  <div id="help-body"></div>
</div>

<script>
  var PROG_GAME_ID = 'straypups_5d';
  var PROG_DENOM   = 5.00;
  // Register PWA service worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('service-worker.js').catch(function(e) {
        console.warn('SW reg failed:', e);
      });
    });
  }
</script>
<script src="js/config.js?v=5.28"></script>
<script src="js/game.js?v=5.28"></script>
<script src="js/progressive.js?v=5.28"></script>
<script src="js/operator.js?v=5.28"></script>
</body>
</html>
